name: Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm install

    - name: Verify application
      run: |
        echo "Verifying application..."
        node -e "require('./run.js'); console.log('Application verified successfully')"

    - name: Prepare static site (GitHub Pages)
      run: |
        echo "Building static site..."
        rm -rf build
        mkdir build
        shopt -s extglob
        cp -r !(build) build/
        echo "Static site created inside /build"

    - name: Upload static site artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm install

    - name: Run basic security check
      run: |
        echo "Running security analysis..."
        node -e "
        const pkg = require('./package.json');
        const deps = { ...pkg.dependencies, ...pkg.devDependencies };
        const knownVulnerable = {
          'request': 'Consider using axios or node-fetch instead',
          'xml2js': 'Check for security updates',
          'moment': 'Consider using date-fns or luxon'
        };
        
        console.log('Dependency Security Check:');
        let vulnerabilities = 0;
        Object.keys(knownVulnerable).forEach(dep => {
          if (deps[dep]) {
            console.log('WARNING: ' + dep + ': ' + knownVulnerable[dep]);
            vulnerabilities++;
          }
        });
        
        if (vulnerabilities === 0) {
          console.log('SUCCESS: No known vulnerable dependencies detected');
        } else {
          console.log('Found ' + vulnerabilities + ' potentially vulnerable dependencies');
        }
        "

  deploy-staging:
    name: Deploy to GitHub Pages (Staging)
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: github-pages

    steps:
    - name: Deploy static site to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  deploy-production:
    name: Deploy to GitHub Pages (Production)
    runs-on: ubuntu-latest
    needs: [build, security-scan, deploy-staging]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: github-pages

    steps:
    - name: Deploy static site to GitHub Pages (Production)
      id: deployment
      uses: actions/deploy-pages@v4

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build, security-scan, deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Generate deployment report
      run: |
        echo "DEPLOYMENT PIPELINE SUMMARY"
        echo "Workflow: ${{ github.workflow }}"
        echo "Trigger: ${{ github.event_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref }}"
        echo "Timestamp: $(date)"
        echo ""
        echo "PIPELINE STATUS:"
        echo "- Build: ${{ needs.build.result }}"
        echo "- Security Scan: ${{ needs['security-scan'].result }}"
        echo "- Staging Deployment: ${{ needs['deploy-staging'].result }}"
        echo "- Production Deployment: ${{ needs['deploy-production'].result }}"
        echo ""
        if [[ "${{ needs.build.result }}" == "success" && \
              "${{ needs['security-scan'].result }}" == "success" && \
              "${{ needs['deploy-staging'].result }}" == "success" ]]; then
          echo "OVERALL STATUS: PIPELINE SUCCESS"
          echo "All stages completed successfully"
        else
          echo "OVERALL STATUS: PIPELINE FAILED"
          echo "Check failed stages above for details"
        fi
